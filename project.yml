# XcodeGen spec for building DAV Drive with Xcode (App Store / TestFlight
# uploads in CI). Day-to-day builds use xtool (Package.swift + xtool.yml); both
# build the same sources. Run scripts/xcode-prepare.sh, not xcodegen directly:
# it creates the .xcode/ inputs this spec refers to.
name: DAVDrive
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: ${DD_VERSION}
    CURRENT_PROJECT_VERSION: ${DD_BUILD}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  # Shared code, linked statically into both bundles (a module, as in SwiftPM).
  DAVCore:
    type: framework.static
    platform: iOS
    sources:
      - path: Sources/DAVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.crazyquark.davdrive.DAVCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  DAVDrive:
    type: application
    platform: iOS
    sources:
      - path: Sources/DAVDrive
      - path: .xcode/Assets.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: DAVCore
        embed: false
      - target: DAVDriveFileProvider
        embed: true
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: DAVDrive
        PRODUCT_BUNDLE_IDENTIFIER: io.github.crazyquark.davdrive
        INFOPLIST_FILE: .xcode/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DAVDriveFileProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/DAVDriveFileProvider
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: DAVCore
        embed: false
    settings:
      base:
        PRODUCT_NAME: DAVDriveFileProvider
        PRODUCT_BUNDLE_IDENTIFIER: io.github.crazyquark.davdrive.DAVDriveFileProvider
        INFOPLIST_FILE: .xcode/FileProvider-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/FileProvider.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
